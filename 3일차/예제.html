<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        *{
            margin: 0;
            padding: 0;
        }

        a{
            text-decoration: none;
            color: black;
        }

        ul,li{
            list-style: none;
        }

        header{
            height: 80px;
            padding: 0 250px;
            background-color: lightgray;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo{
            font-size: 30px;
        }

        .menu_wrap{
            display: flex;
        }

        .menu_wrap li{
            font-size: 18px;
            margin-left: 50px;
        }

    </style>
</head>
<body>
    
    <header>

        <div class="logo">
            <a href="#">LOGO</a>
        </div>

        <ul class="menu_wrap">
            <li><a href="#">Home</a></li>
            <li><a href="#">Info</a></li>
            <li><a href="#">Product</a></li>
            <li><a href="#">Q&A</a></li>
        </ul>
        
    </header>

</body>
</html>
