<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- *br태그 
    =>줄바꿈 태그 
    =>짝이 없는 태그로 단독태그라고 부름  -->

    <!-- *주석
    =>파일 내부에 글을 남길수 있고, 
    브라우저에서 내용을 표현하기 싫을때 사용
    =>단축키: 컨트롤(맥:커멘드) + /  -->

    <!-- *p, div 태그
    =>문단이나 설명을 작성할때 사용하는 태그  -->

    <p>
        html에 글을 작성하게 되면 글이 표현이 되는데 <br>
        줄 바꿈해서 작성하여 브라우저에 열게 되면 <br>
        어떻게 될까? 
    </p>

    <div>
        html에 글을 작성하게 되면 글이 표현이 되는데 <br>
        줄 바꿈해서 작성하여 브라우저에 열게 되면 <br>
        어떻게 될까? 
    </div>
    
    
</body>
</html>
